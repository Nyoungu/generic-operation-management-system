<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  .hub * { box-sizing: border-box; }
  .hub {
    --bg: #0A0A09;
    --panel: #131311;
    --panel-2: #1B1A16;
    --line: #35322A;
    --amber: #E08A3E;
    --amber-dim: #6B4A26;
    --teal: #3FBFAE;
    --teal-dim: #1F5A51;
    --red: #C24A3E;
    --locked: #4A463C;
    --text: #EDE7DA;
    --text-soft: #8A8377;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text);
    background: var(--bg);
    background-image:
      linear-gradient(rgba(224,138,62,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(224,138,62,0.035) 1px, transparent 1px);
    background-size: 28px 28px;
    border-radius: 14px;
    padding: 28px;
    max-width: 1000px;
    margin: 0 auto;
  }
  .hub .disp { font-family: 'Orbitron', sans-serif; }
  .hub button { font-family: 'IBM Plex Mono', monospace; cursor: pointer; }
  @keyframes hub-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .hub .pulse { animation: hub-pulse 1.8s ease-in-out infinite; }
  .hub .tree-wrap { position: relative; width: 100%; aspect-ratio: 900 / 640; }
  .hub .node-anchor { position: absolute; }
  .hub .node {
    display: block; width: 148px; height: 84px;
    clip-path: polygon(14% 0%, 86% 0%, 100% 50%, 86% 100%, 14% 100%, 0% 50%);
    padding: 2px; cursor: pointer;
    transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.28s ease;
  }
  .hub .node:hover { transform: scale(1.1) translateY(-4px); filter: brightness(1.25); }
  .hub .node.active-node { transform: scale(1.08); filter: brightness(1.3); }
  .hub .node-inner {
    width: 100%; height: 100%;
    clip-path: polygon(14% 0%, 86% 0%, 100% 50%, 86% 100%, 14% 100%, 0% 50%);
    background: var(--panel);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 6px 10px;
  }
  .hub .node.root { width: 168px; height: 168px; clip-path: circle(50% at 50% 50%); }
  .hub .node.root .node-inner { clip-path: circle(50% at 50% 50%); }
  .hub .subpanel {
    position: absolute; width: 230px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px;
    font-size: 11px; color: var(--text-soft); z-index: 5;
    animation: hub-pop 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .hub .subpanel .tick { position: absolute; top: -9px; width: 2px; height: 9px; background: var(--line); }
  @keyframes hub-pop { from { opacity: 0; transform: translateY(-6px) scale(0.94); } to { opacity: 1; transform: translateY(0) scale(1); } }
</style>

<div class="hub" id="hub-root">
  <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:20px; border-bottom:1px solid var(--line); padding-bottom:16px;">
    <div>
      <div style="font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--text-soft); margin-bottom:6px;">Command deck</div>
      <div class="disp" style="font-size:26px; font-weight:800; letter-spacing:1px; color:var(--amber);">AGENT HUB</div>
    </div>
    <div style="text-align:right;">
      <div class="disp" style="font-size:30px; font-weight:800;" id="hub-count">0/0</div>
      <div style="font-size:10px; letter-spacing:1.5px; color:var(--text-soft); text-transform:uppercase;">agents online</div>
    </div>
  </div>

  <div class="tree-wrap" id="hub-treewrap">
    <svg id="hub-svg" viewBox="0 0 900 640" style="position:absolute; inset:0; width:100%; height:100%;"></svg>
    <div id="hub-nodes" style="position:absolute; inset:0;"></div>
    <div id="hub-panels" style="position:absolute; inset:0; pointer-events:none;"></div>
  </div>

  <div style="margin-top:8px; display:flex; gap:18px; font-size:10px; color:var(--text-soft); letter-spacing:1px; text-transform:uppercase; flex-wrap:wrap;">
    <span><span style="display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--teal); margin-right:6px;"></span>online</span>
    <span><span style="display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--amber-dim); margin-right:6px;"></span>paused</span>
    <span><span style="display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--locked); margin-right:6px;"></span>coming soon</span>
  </div>
</div>

<script>
(function(){
  const root = document.getElementById('hub-root');

  const NODES = [
    { id:'core', name:'NATHAN CORE', role:'Central control system for every agent on the floor', x:450, y:80, parent:null, locked:false, status:'online' },
    { id:'inv', name:'Inventory agent', role:'Watches stock levels and flags low materials', x:150, y:270, parent:'core', locked:false, status:'online', dataKey:'inventory' },
    { id:'ord', name:'Orders agent', role:'Tracks customer orders through to delivery', x:350, y:270, parent:'core', locked:false, status:'online', dataKey:'orders' },
    { id:'prod', name:'Production agent', role:'Moves jobs across the shop floor stages', x:550, y:270, parent:'core', locked:false, status:'online', dataKey:'production' },
    { id:'sup', name:'Supplier agent', role:'Holds supplier contacts and lead times', x:750, y:270, parent:'core', locked:false, status:'online', dataKey:'suppliers' },
    { id:'reorder', name:'Reorder automation', role:'Auto-drafts purchase orders when stock hits reorder point', x:150, y:480, parent:'inv', locked:true, status:'locked' },
    { id:'invoice', name:'Invoice agent', role:'Generates and sends invoices when orders ship', x:350, y:480, parent:'ord', locked:true, status:'locked' },
    { id:'sched', name:'Scheduling agent', role:'Balances jobs across available shop time', x:550, y:480, parent:'prod', locked:true, status:'locked' },
    { id:'price', name:'Price watch agent', role:'Compares supplier pricing as new ones are added', x:750, y:480, parent:'sup', locked:true, status:'locked' }
  ];

  let state = {};
  let loaded = false;
  let openNode = null;

  async function load() {
    try {
      const r = await window.storage.get('agent-tree', false);
      state = r ? JSON.parse(r.value) : {};
    } catch (e) { state = {}; }
    NODES.forEach(n => { if (!state[n.id]) state[n.id] = { status: n.status }; });
    loaded = true;
    render();
  }
  async function save() {
    try { await window.storage.set('agent-tree', JSON.stringify(state), false); }
    catch (e) { console.error('save failed', e); }
  }
  function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }

  function colorFor(status) {
    if (status === 'online') return 'var(--teal)';
    if (status === 'paused') return 'var(--amber-dim)';
    return 'var(--locked)';
  }

  function drawEdges() {
    const svg = document.getElementById('hub-svg');
    let html = '';
    NODES.filter(n => n.parent).forEach(n => {
      const p = NODES.find(x => x.id === n.parent);
      const st = state[n.id].status;
      const color = st === 'locked' ? '#3A362E' : (st === 'online' ? '#6B5638' : '#4A4030');
      const dash = st === 'locked' ? 'stroke-dasharray="4 5"' : '';
      html += `<line x1="${p.x}" y1="${p.y}" x2="${n.x}" y2="${n.y}" stroke="${color}" stroke-width="2" ${dash} />`;
    });
    svg.innerHTML = html;
  }

  function renderNodes() {
    const wrap = document.getElementById('hub-nodes');
    let html = '';
    NODES.forEach(n => {
      const st = state[n.id].status;
      const isLocked = st === 'locked';
      const ring = colorFor(st);
      const pctX = (n.x/900*100).toFixed(2);
      const pctY = (n.y/640*100).toFixed(2);
      html += `<div class="node-anchor" style="left:${pctX}%; top:${pctY}%; transform:translate(-50%,-50%);">
        <div class="node ${n.id==='core'?'root':''} ${openNode===n.id?'active-node':''}" data-node="${n.id}" style="background:${ring}; opacity:${isLocked?0.55:1};">
          <div class="node-inner">
            <div class="disp" style="font-size:${n.id==='core'?'13px':'11px'}; font-weight:600; line-height:1.25; letter-spacing:0.3px;">${esc(n.name)}</div>
            <div style="margin-top:6px; display:flex; align-items:center; gap:5px;">
              <span class="${st==='online'?'pulse':''}" style="width:6px; height:6px; border-radius:50%; background:${ring}; display:inline-block;"></span>
              <span style="font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--text-soft);">${isLocked?'coming soon':st}</span>
            </div>
          </div>
        </div>
      </div>`;
    });
    wrap.innerHTML = html;
  }

  function render() {
    if (!loaded) return;
    drawEdges();
    renderNodes();
    const online = Object.values(state).filter(s => s.status==='online').length;
    const total = NODES.filter(n => !n.locked).length;
    document.getElementById('hub-count').textContent = online + '/' + total;
    wire();
  }

  async function fetchSectorSummary(n) {
    if (!n.dataKey) return null;
    try {
      const r = await window.storage.get(n.dataKey, false);
      return r ? JSON.parse(r.value) : [];
    } catch (e) { return []; }
  }

  async function buildPanelContent(n) {
    if (n.locked) {
      return `<div class="disp" style="font-size:12px; color:var(--text); margin-bottom:6px;">${esc(n.name)}</div>
        <div style="color:var(--locked); font-size:9px; letter-spacing:1px; text-transform:uppercase; margin-bottom:8px;">Locked · not built yet</div>
        <div>${esc(n.role)}</div>`;
    }
    if (n.id === 'core') {
      let counts = {};
      for (const key of ['inventory','orders','production','suppliers']) {
        try { const r = await window.storage.get(key, false); counts[key] = r ? JSON.parse(r.value).length : 0; }
        catch(e) { counts[key] = 0; }
      }
      return `<div class="disp" style="font-size:12px; color:var(--text); margin-bottom:8px;">SYSTEM STATUS</div>
        <div>${counts.inventory} materials · ${counts.orders} orders · ${counts.production} jobs · ${counts.suppliers} suppliers</div>
        <div style="margin-top:6px; color:var(--text-soft);">Pulled live from Nathan Floor Operations.</div>`;
    }
    const data = await fetchSectorSummary(n);
    if (!data || !data.length) {
      return `<div class="disp" style="font-size:12px; color:var(--text); margin-bottom:6px;">${esc(n.name)}</div>
        <div>No data yet. Add some in Nathan Floor Operations and it'll show up here.</div>`;
    }
    if (n.id === 'inv') {
      const low = data.filter(i => Number(i.qty) <= Number(i.reorder));
      let html = `<div class="disp" style="font-size:12px; color:var(--text); margin-bottom:6px;">${data.length} materials tracked</div>`;
      if (low.length) {
        html += `<div style="color:var(--red); margin-bottom:4px;">${low.length} below reorder point:</div>`;
        low.slice(0,4).forEach(i => html += `<div>· ${esc(i.name)} (${i.qty} ${esc(i.unit)})</div>`);
      } else html += `<div>All materials above reorder point.</div>`;
      return html;
    }
    if (n.id === 'ord') {
      const open = data.filter(o => !['Delivered','Cancelled'].includes(o.status));
      let html = `<div class="disp" style="font-size:12px; color:var(--text); margin-bottom:6px;">${open.length} open of ${data.length} orders</div>`;
      data.slice(-4).reverse().forEach(o => html += `<div>· ${esc(o.customer)} — ${esc(o.status)}</div>`);
      return html;
    }
    if (n.id === 'prod') {
      const active = data.filter(p => p.stage !== 'Complete');
      let html = `<div class="disp" style="font-size:12px; color:var(--text); margin-bottom:6px;">${active.length} active jobs</div>`;
      active.slice(0,4).forEach(p => html += `<div>· ${esc(p.title)} — ${esc(p.stage)}</div>`);
      if (!active.length) html += `<div>Nothing on the floor right now.</div>`;
      return html;
    }
    if (n.id === 'sup') {
      let html = `<div class="disp" style="font-size:12px; color:var(--text); margin-bottom:6px;">${data.length} suppliers logged</div>`;
      data.slice(0,4).forEach(s => html += `<div>· ${esc(s.name)}</div>`);
      return html;
    }
    return '';
  }

  function toggleButtonHtml(n) {
    if (n.locked || n.id === 'core') return '';
    const st = state[n.id].status;
    const isOnline = st === 'online';
    const ring = colorFor(st);
    return `<div style="margin-top:10px; border-top:1px solid var(--line); padding-top:8px;">
      <button data-toggle="${n.id}" style="background:transparent; border:1px solid ${ring}; color:${ring}; padding:6px 12px; border-radius:6px; font-size:10px; letter-spacing:1px; text-transform:uppercase;">${isOnline?'Pause agent':'Activate agent'}</button>
    </div>`;
  }

  async function fillPanelBody(n) {
    const body = document.getElementById('panel-body');
    if (!body) return;
    body.innerHTML = await buildPanelContent(n) + toggleButtonHtml(n);
    const toggleBtn = body.querySelector('[data-toggle]');
    if (toggleBtn) toggleBtn.onclick = async () => {
      state[n.id].status = state[n.id].status === 'online' ? 'paused' : 'online';
      await save();
      renderNodes(); wire();
      await fillPanelBody(n);
    };
  }

  async function openPanel(n) {
    const panels = document.getElementById('hub-panels');
    if (openNode === n.id) { openNode = null; panels.innerHTML = ''; renderNodes(); wire(); return; }
    openNode = n.id;
    renderNodes(); wire();
    const pctX = (n.x/900*100);
    const pctY = (n.y/640*100);
    const align = pctX < 30 ? 'left' : (pctX > 70 ? 'right' : 'center');
    let posStyle = `top:${(pctY + 9).toFixed(2)}%;`;
    if (align === 'center') posStyle += `left:${pctX.toFixed(2)}%; transform:translateX(-50%);`;
    else if (align === 'left') posStyle += `left:${pctX.toFixed(2)}%;`;
    else posStyle += `left:${pctX.toFixed(2)}%; transform:translateX(-100%);`;
    const tickLeft = align === 'center' ? '50%' : (align === 'left' ? '20px' : 'calc(100% - 20px)');
    panels.innerHTML = `<div class="subpanel" style="${posStyle} pointer-events:auto;">
        <div class="tick" style="left:${tickLeft};"></div>
        <div id="panel-body">loading...</div>
      </div>`;
    await fillPanelBody(n);
  }

  function wire() {
    root.querySelectorAll('[data-node]').forEach(el => {
      el.onclick = async () => {
        const n = NODES.find(x => x.id === el.dataset.node);
        if (!n) return;
        await openPanel(n);
      };
    });
  }

  load();
})();
</script>
